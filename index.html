<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Defensa por oleadas v0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Pantalla táctica de dron: tierra, oliva y gris; el naranja de señal marca lo enemigo y lo urgente; las luces cálidas son las vidas.
   Mapa en canvas, interfaz en HTML encima. Un solo tema oscuro, a propósito. */
:root{
  --bg:#121410; --panel:rgba(22,25,19,.92); --panel-2:#20241c; --ink:#ece6d2; --mute:#a9a490;
  --olive:#a3c172; --olive-d:#3e5a2a; --sand:#e6dfc4; --signal:#ee6b2f; --rule:rgba(236,230,210,.16); --light:#ffe6a3;
  --f-disp:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --f-text:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --bar:60px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:500 15px/1.35 var(--f-disp);overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation;overflow:hidden}
button{font:inherit;color:inherit;-webkit-appearance:none;appearance:none}
button:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
[hidden]{display:none!important}
#app{position:fixed;inset:0;display:grid;grid-template-rows:minmax(0,1fr) calc(var(--bar) + env(safe-area-inset-bottom,0px));padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) 0 env(safe-area-inset-left,0px)}
#stage{position:relative;overflow:hidden;min-height:0}
#cv{position:absolute;left:0;top:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}

.chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--rule);border-radius:6px;padding:3px 8px;font:700 14px var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.chip small{font:600 11px var(--f-disp);letter-spacing:.1em;color:var(--mute);text-transform:uppercase}
#hud{position:absolute;left:8px;top:8px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none;max-width:calc(50% - 20px)}
#hud .bar{display:block;width:40px;height:5px;border-radius:2px;background:rgba(255,230,163,.16);overflow:hidden}
#hud .bar b{display:block;height:100%;width:100%;background:var(--light);transition:width .3s}
#hud .low{border-color:var(--signal)}
#tr{position:absolute;right:8px;top:8px;display:flex;gap:6px}
.ib{min-width:38px;height:34px;display:grid;place-items:center;padding:0 8px;background:var(--panel);border:1px solid var(--rule);border-radius:6px;cursor:pointer;font:600 13px var(--f-disp);letter-spacing:.08em;text-transform:uppercase}
.ib svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ib[aria-pressed="true"]{border-color:var(--olive);color:var(--olive)}

#parte{position:absolute;left:50%;top:8px;transform:translateX(-50%);width:min(420px,calc(100% - 470px));min-width:230px;background:var(--panel);border:1px solid var(--rule);border-left:3px solid var(--signal);border-radius:6px;padding:6px 10px 7px;cursor:pointer}
#parte .h{display:flex;justify-content:space-between;gap:8px;font:700 12px var(--f-mono);letter-spacing:.08em;color:var(--signal);text-transform:uppercase}
#parte .h span:last-child{color:var(--mute);font-weight:500}
#parte .chips{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:4px}
#parte .chips button{display:inline-flex;align-items:center;gap:3px;background:none;border:0;padding:0;font:700 13px var(--f-mono);cursor:pointer}
#parte .chips canvas{width:22px;height:22px}
#parte .t{margin-top:4px;font:400 13px/1.3 var(--f-text);color:var(--ink)}
#parte .a{margin-top:4px;font:600 12.5px/1.3 var(--f-text);color:var(--light)}
#parte.min .chips,#parte.min .t,#parte.min .a{display:none}

#spawn{position:absolute;left:50%;top:8px;transform:translateX(-50%);display:flex;flex-wrap:wrap;gap:4px;justify-content:center;max-width:calc(100% - 360px);background:var(--panel);border:1px solid var(--rule);border-radius:6px;padding:5px}
#spawn button{display:inline-flex;align-items:center;gap:2px;background:var(--panel-2);border:1px solid var(--rule);border-radius:5px;padding:2px 6px;font:600 12px var(--f-mono);cursor:pointer}
#spawn canvas{width:20px;height:20px}

#panel{position:absolute;right:8px;top:50px;bottom:8px;width:min(300px,48%);background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:9px 10px;display:flex;flex-direction:column;gap:8px;overflow:auto}
#panel .ph{display:flex;align-items:center;gap:8px}
#panel .ph h2{margin:0;font:700 20px/1 var(--f-disp);text-transform:uppercase;letter-spacing:.04em;flex:1}
#panel .ph button{background:none;border:1px solid var(--rule);border-radius:6px;width:30px;height:28px;cursor:pointer}
#panel .role{font:400 12.5px/1.3 var(--f-text);color:var(--mute)}
.seg{display:flex;border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.seg button{flex:1;background:none;border:0;border-left:1px solid var(--rule);padding:5px 2px;font:600 12px var(--f-disp);letter-spacing:.06em;text-transform:uppercase;color:var(--mute);cursor:pointer}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--olive-d);color:var(--ink)}
.paths{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.path{display:flex;flex-direction:column;gap:4px}
.path .lab{font:600 11px var(--f-disp);letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.up{display:flex;flex-direction:column;gap:1px;text-align:left;background:var(--panel-2);border:1px solid var(--rule);border-radius:6px;padding:5px 7px;cursor:pointer}
.up b{font:600 14px/1.1 var(--f-disp)}
.up i{font:normal 400 11.5px/1.25 var(--f-text);color:var(--mute)}
.up span{font:700 12px var(--f-mono);color:var(--olive)}
.up.own{border-color:var(--olive-d);background:rgba(62,90,42,.35);cursor:default}
.up.own span{color:var(--mute)}
.up.next.no span{color:var(--signal)}
.up.lock{opacity:.45;cursor:default}
.up.pw b::after{content:" · poder";font:600 11px var(--f-disp);color:var(--light);letter-spacing:.06em}
#panel .row{display:flex;gap:6px}
#panel .row button{flex:1;background:var(--panel-2);border:1px solid var(--rule);border-radius:6px;padding:7px 6px;font:600 13px var(--f-disp);letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
#panel .row .sell{border-color:rgba(238,107,47,.6);color:#f2a27c}

#confirm{position:absolute;display:flex;gap:8px;z-index:3}
#confirm button{width:46px;height:40px;border-radius:8px;border:1px solid var(--rule);background:var(--panel);font:700 20px var(--f-disp);cursor:pointer}
#confirm .ok{border-color:var(--olive);color:var(--olive)}
#confirm .why{position:absolute;top:44px;left:0;white-space:nowrap;font:600 12px var(--f-mono);color:var(--signal);background:var(--panel);padding:2px 6px;border-radius:4px}

#toast{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);max-width:calc(100% - 24px);background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:7px 12px;font:400 14px/1.3 var(--f-text);text-align:center;pointer-events:none;opacity:0;transition:opacity .2s}
#toast.on{opacity:1}
#toast b{color:var(--light)}
#pausa{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;font:700 34px var(--f-disp);letter-spacing:.3em;color:rgba(236,230,210,.8);text-shadow:0 2px 8px #000}

#bar{display:flex;align-items:stretch;gap:6px;padding:5px 8px calc(5px + env(safe-area-inset-bottom,0px));background:#191c16;border-top:1px solid var(--rule);min-width:0}
.grp{display:flex;gap:5px;min-width:0}
.sep{width:1px;background:var(--rule);margin:4px 2px}
.tb{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-width:60px;padding:2px 6px;background:var(--panel-2);border:1px solid var(--rule);border-radius:6px;cursor:pointer;overflow:hidden}
.tb canvas{width:24px;height:24px}
.tb .n{font:600 11px/1 var(--f-disp);letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.tb .p{font:700 12px/1 var(--f-mono)}
.tb[aria-pressed="true"]{border-color:var(--olive);box-shadow:inset 0 0 0 1px var(--olive)}
.tb.no .p{color:var(--signal)}
.tb.no canvas{opacity:.5}
.pb .cd{position:absolute;inset:0;background:conic-gradient(rgba(0,0,0,.62) calc(var(--p,0) * 1turn),transparent 0);pointer-events:none}
.pb .s{position:absolute;right:4px;top:3px;font:700 11px var(--f-mono);color:var(--light)}
#go{margin-left:auto;min-width:122px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--olive-d);border:1px solid var(--olive);border-radius:8px;font:700 17px/1 var(--f-disp);letter-spacing:.08em;text-transform:uppercase;cursor:pointer;padding:0 10px}
#go small{font:600 11px var(--f-disp);letter-spacing:.08em;color:#d6e4bf;margin-top:2px}
#go.run{background:var(--panel-2);border-color:var(--rule)}

#sheet{position:fixed;inset:0;z-index:30;background:rgba(8,9,7,.74);display:grid;place-items:center;padding:calc(10px + env(safe-area-inset-top,0px)) calc(10px + env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) calc(10px + env(safe-area-inset-left,0px))}
#sheet .card{width:min(680px,100%);max-height:100%;overflow:auto;background:#1a1d17;border:1px solid var(--rule);border-radius:10px;padding:16px 18px 18px;-webkit-user-select:text;user-select:text}
.card h1{margin:0;font:700 clamp(30px,6vw,44px)/.95 var(--f-disp);text-transform:uppercase;letter-spacing:.02em;text-wrap:balance}
.card h2{margin:14px 0 6px;font:700 20px/1.1 var(--f-disp);text-transform:uppercase;letter-spacing:.04em}
.card h3{margin:10px 0 4px;font:700 16px/1.1 var(--f-disp);text-transform:uppercase;letter-spacing:.04em;color:var(--olive)}
.card p,.card li{font:400 15px/1.45 var(--f-text);color:var(--ink);max-width:62ch}
.card p.m{color:var(--mute);font-size:13.5px}
.card .eyebrow{font:700 12px var(--f-mono);letter-spacing:.14em;color:var(--signal);text-transform:uppercase;margin:0 0 6px}
.card .tx{border-left:3px solid var(--signal);padding:6px 10px;background:rgba(238,107,47,.08);margin:12px 0}
.card .tx p{margin:0;font-family:var(--f-mono);font-size:13px;line-height:1.5}
.diffs{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-top:12px}
.diffs button{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;background:var(--panel-2);border:1px solid var(--rule);border-radius:8px;padding:10px 11px;cursor:pointer}
.diffs button b{font:700 22px/1 var(--f-disp);text-transform:uppercase;letter-spacing:.04em}
.diffs button i{font:normal 400 12.5px/1.3 var(--f-text);color:var(--mute)}
.diffs button em{font:normal 700 12px var(--f-mono);color:var(--light)}
.diffs button:hover{border-color:var(--olive)}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.btn{background:var(--panel-2);border:1px solid var(--rule);border-radius:7px;padding:9px 14px;font:600 15px var(--f-disp);letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.btn.pri{background:var(--olive-d);border-color:var(--olive)}
.btn.warn{border-color:rgba(238,107,47,.7);color:#f2a27c}
.fichas{display:grid;gap:8px}
.ficha{display:grid;grid-template-columns:56px 1fr;gap:4px 12px;background:var(--panel-2);border:1px solid var(--rule);border-radius:8px;padding:10px}
.ficha canvas{width:56px;height:56px;grid-row:span 3}
.ficha h3{margin:0;color:var(--ink)}
.ficha p{margin:0;font-size:14px}
.ficha table{border-collapse:collapse;font:500 12.5px var(--f-mono);margin-top:4px}
.ficha td{padding:2px 12px 2px 0;font-variant-numeric:tabular-nums;vertical-align:top}
.ficha td:first-child{color:var(--mute);font-family:var(--f-text)}
.ficha ul{margin:4px 0 0;padding-left:18px}
.ficha li{font-size:13.5px}
.tabs{display:flex;gap:6px;margin:10px 0}
.help{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:10px 0}
.help div{display:grid;grid-template-columns:40px 1fr;gap:8px;align-items:center;background:var(--panel-2);border-radius:8px;padding:8px}
.help canvas{width:40px;height:40px}
.help p{margin:0;font-size:13.5px}
.dots{display:flex;gap:6px;justify-content:center;margin-top:10px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--rule)}
.dots i.on{background:var(--olive)}
textarea{width:100%;min-height:160px;background:#11130f;color:var(--ink);border:1px solid var(--rule);border-radius:6px;padding:10px;font:400 12.5px/1.45 var(--f-mono);-webkit-user-select:text;user-select:text}
.stars{font:700 30px var(--f-mono);letter-spacing:.2em;color:var(--light)}
.stars span{color:rgba(255,230,163,.22)}

#rotate{position:fixed;inset:0;z-index:40;background:#121410;display:grid;place-items:center;text-align:center;padding:24px}
#rotate div{display:flex;flex-direction:column;gap:12px;align-items:center;max-width:320px}
#rotate b{font:700 28px/1 var(--f-disp);text-transform:uppercase;letter-spacing:.04em}
#rotate p{font:400 15px/1.4 var(--f-text);margin:0;color:var(--mute)}
#rotate svg{width:84px;height:84px;stroke:var(--olive);fill:none;stroke-width:2}

@media (max-width:760px){
  #parte{top:46px;width:min(420px,calc(100% - 16px))}
  #spawn{top:46px;max-width:calc(100% - 16px)}
  #panel{top:46px}
  .tb .n{display:none}
  .tb{min-width:52px}
  #go{min-width:96px;font-size:15px}
}
@media (max-height:420px){ :root{--bar:52px} .tb canvas{width:22px;height:22px} }
@media (prefers-reduced-motion:reduce){ #toast,#hud .bar b{transition:none} }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="cv" aria-label="Mapa de la defensa"></canvas>
    <div id="hud" aria-live="polite">
      <span class="chip" id="hLuces"><small>Luces</small><span id="vLuces">150</span><span class="bar"><b id="bLuces"></b></span></span>
      <span class="chip"><small>$</small><span id="vPlata">650</span></span>
      <span class="chip" id="hRonda" hidden><small>Ronda</small><span id="vRonda">1/20</span></span>
    </div>
    <div id="tr">
      <button class="ib" id="bConsejo" type="button" aria-label="Consejo">Consejo</button>
      <button class="ib" id="bPausa" type="button" aria-label="Pausa" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg></button>
      <button class="ib" id="bSonido" type="button" aria-label="Sonido" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path id="sOn" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg></button>
      <button class="ib" id="bMenu" type="button" aria-label="Menú"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    </div>
    <div id="parte" hidden></div>
    <div id="spawn" hidden></div>
    <div id="panel" hidden></div>
    <div id="confirm" hidden><button class="ok" id="cOk" type="button" aria-label="Poner acá">✓</button><button id="cNo" type="button" aria-label="Cancelar">✕</button><span class="why" id="cWhy" hidden></span></div>
    <div id="pausa" hidden>PAUSA</div>
    <div id="toast" role="status"></div>
  </div>
  <div id="bar">
    <div class="grp" id="gTowers"></div>
    <div class="sep"></div>
    <div class="grp" id="gPowers"></div>
    <button id="go" type="button">▶ Ronda 1<small>Empezar</small></button>
  </div>
</div>
<div id="sheet" hidden><div class="card" id="card"></div></div>
<div id="rotate" hidden><div>
  <svg viewBox="0 0 84 84"><rect x="28" y="10" width="28" height="48" rx="4"/><path d="M14 66h50a6 6 0 0 0 6-6V52"/><path d="M64 46l6 6 6-6"/></svg>
  <b>Girá el teléfono</b>
  <p>Se juega con el teléfono en horizontal: así entra el mapa entero.</p>
  <button class="btn" id="rotOk" type="button">Jugar igual</button>
</div></div>
<script>
/* Defensa por oleadas · motor del prototipo (v0)
   Puro y determinista: no toca la pantalla. Lo usan la página y las simulaciones.
   Todos los números del juego son inventados. */
(function (root) {
'use strict';

const W = 1200, H = 600, TICK = 1 / 30, ROAD = 20, TOWER_R = 17, SAMPLE_STEP = 8;

/* ---------- mapa: Buenos Aires, esquema sin escala ----------
   Entra desde el río por Corrientes, pasa el Obelisco, baja por la 9 de Julio,
   vuelve por Av. de Mayo a Plaza de Mayo, baja por Paseo Colón, cruza Independencia,
   sube por Entre Ríos hasta el Congreso y sale por Rivadavia hacia el oeste. */
const PATH = [[1200,100],[600,100],[600,320],[930,320],[930,500],[300,500],[300,290],[0,290]];
const SEG = []; let LEN = 0;
for (let i = 0; i < PATH.length - 1; i++) {
  const [x0, y0] = PATH[i], [x1, y1] = PATH[i + 1];
  const len = Math.hypot(x1 - x0, y1 - y0);
  SEG.push({ x0, y0, x1, y1, len, d0: LEN, a: Math.atan2(y1 - y0, x1 - x0) });
  LEN += len;
}
const WATER = [
  { x: 1112, y: 0, w: 88, h: 600 },                                   // Río de la Plata
  { x: 1034, y: 28, w: 46, h: 118 }, { x: 1034, y: 164, w: 46, h: 118 }, // diques de Puerto Madero
  { x: 1034, y: 300, w: 46, h: 118 }, { x: 1034, y: 436, w: 46, h: 118 }
];

function posAt(d, out) {
  out = out || {};
  if (d <= 0) { const s = SEG[0]; out.x = s.x0; out.y = s.y0; out.a = s.a; return out; }
  for (let i = 0; i < SEG.length; i++) {
    const s = SEG[i];
    if (d <= s.d0 + s.len) { const f = (d - s.d0) / s.len; out.x = s.x0 + (s.x1 - s.x0) * f; out.y = s.y0 + (s.y1 - s.y0) * f; out.a = s.a; return out; }
  }
  const s = SEG[SEG.length - 1]; out.x = s.x1; out.y = s.y1; out.a = s.a; return out;
}
function distToPath(x, y) {
  let m = Infinity;
  for (const s of SEG) {
    const dx = s.x1 - s.x0, dy = s.y1 - s.y0;
    let f = ((x - s.x0) * dx + (y - s.y0) * dy) / (s.len * s.len);
    f = Math.max(0, Math.min(1, f));
    const d = Math.hypot(x - (s.x0 + dx * f), y - (s.y0 + dy * f));
    if (d < m) m = d;
  }
  return m;
}
const SAMPLES = [];
for (let d = 0; d <= LEN; d += SAMPLE_STEP) { const p = posAt(d); SAMPLES.push({ x: p.x, y: p.y, d }); }

const dist2 = (a, b) => (a.x - b.x) * (a.x - b.x) + (a.y - b.y) * (a.y - b.y);

/* ---------- enemigos ----------
   base = luces que apaga por sí mismo; carga = base + lo que lleva adentro. */
const ENEMY = {
  esc:   { name: 'Escuadra',      hp: 1,   speed: 52, reward: 2,  base: 1,  ground: true, infantry: true, r: 9 },
  cam:   { name: 'Camioneta',     hp: 4,   speed: 78, reward: 3,  base: 1,  ground: true, kids: [['esc', 2]], r: 11 },
  dron:  { name: 'Dron',          hp: 2,   speed: 92, reward: 2,  base: 1,  air: true, r: 9 },
  dronb: { name: 'Dron bajo',     hp: 2,   speed: 86, reward: 3,  base: 1,  air: true, camo: true, r: 8 },
  blin:  { name: 'Blindado',      hp: 16,  speed: 38, reward: 6,  base: 2,  ground: true, armored: true, kids: [['cam', 2]], r: 15 },
  rep:   { name: 'Reparación',    hp: 8,   speed: 48, reward: 4,  base: 2,  ground: true, repair: true, r: 12 },
  nod:   { name: 'Dron nodriza',  hp: 240, speed: 26, reward: 40, base: 20, air: true, boss: true, kids: [['dron', 6], ['dronb', 4]], r: 30 },
  col:   { name: 'Columna pesada',hp: 450, speed: 20, reward: 80, base: 40, ground: true, armored: true, boss: true, kids: [['blin', 3]], r: 34 }
};
function cargaOf(k) { const e = ENEMY[k]; let c = e.base; if (e.kids) for (const [t, n] of e.kids) c += n * cargaOf(t); return c; }
for (const k in ENEMY) { ENEMY[k].key = k; ENEMY[k].carga = cargaOf(k); }

function towerStats(type, tiers) {

function sueldo(r) { return 70 + 4 * r; }

function newTypes(r) {
  if (r < 1 || r > ROUNDS.length) return [];
  const seen = new Set();
  for (let i = 0; i < r - 1; i++) for (const [t] of ROUNDS[i]) seen.add(t);
  const out = [];

  for (const w of WATER) if (x > w.x - 6 && x < w.x + w.w + 6 && y > w.y - 6 && y < w.y + w.h + 6) return 'agua';
  for (const t of G.towers) if ((t.x - x) * (t.x - x) + (t.y - y) * (t.y - y) < (2 * TOWER_R) * (2 * TOWER_R)) return 'ocupado';

function place(G, type, x, y) {

  if (G.money < cost(G, TOWER[tw.type].paths[p][nt - 1].cost)) return 'plata';

}
function upgrade(G, tw, p) {

  G.money -= c; tw.tiers[p]++; tw.spent += c; tw.now += c;

function sellValue(tw) { return Math.round((tw.now + (tw.spent - tw.now) * 0.75) / 5) * 5; }

function startRound(G) {

  for (const [type, n, gap, delay] of ROUNDS[G.round - 1]) for (let i = 0; i < n; i++) q.push({ at: Math.round((delay + i * gap) / TICK), type });

function pick(G, tw, s) {

    else if (m === 'fuerte') cand.sort((a, b) => (b.hp + (ENEMY[b.type].boss ? 1e5 : 0)) - (a.hp + (ENEMY[a.type].boss ? 1e5 : 0)) || b.d - a.d);

function step(G) {

  if (G.inRound) {
    G.rt++;
    for (const k in G.pw) if (G.pw[k] > 0) G.pw[k] = Math.max(0, G.pw[k] - TICK);
    while (G.queue.length && G.queue[0].at <= G.rt) { const q = G.queue.shift(); spawn(G, q.type, 0); }
  }
  const radars = G.radars;
  for (const e of G.enemies) {
    if (e.dead) continue;

        for (const o of G.enemies) {
          if (o === e || o.dead) continue;
          const O = ENEMY[o.type];
          if (O.boss || !O.ground) continue;
          if (dist2(o, e) <= 80 * 80 && o.hp < o.max) o.hp = Math.min(o.max, o.hp + o.max * 0.12);
        }

      for (const e of G.enemies) if (!e.dead && ENEMY[e.type].air && dist2(r, e) <= r.s.range * r.s.range) { e.stun = Math.max(e.stun, G.t + 45); any = true; }

          const O = ENEMY[o.type];

/* ---------------- consejo ---------------- */
function expandTypes(r) {
  const set = new Set();
  const add = t => { set.add(t); const D = E.ENEMY[t]; if (D.kids) for (const [k] of D.kids) add(k); };
  if (r >= 1 && r <= E.ROUNDS.length) for (const [t] of E.ROUNDS[r - 1]) add(t);

}
function capable(t, D) {

  if (D.air ? !t.s.air : !t.s.ground) return false;
  if (D.armored && !t.s.perfora) return false;
  return true;
}
function spotFor(type, need) {
  const s = E.towerStats(type, [0, 0]);
  if (type === 'radar') {
    let best = null;
    for (let x = 20; x <= 1180; x += 20) for (let y = 20; y <= 580; y += 20) {
      if (E.canPlace(G, 'radar', x, y)) continue;
      let n = 0; for (const t of G.towers) if (!t.s.aura && t.s.air && (t.x - x) ** 2 + (t.y - y) ** 2 <= s.range * s.range) n += 10;
      for (const p of E.SAMPLES) if ((p.x - x) ** 2 + (p.y - y) ** 2 <= s.range * s.range) n += 0.02;
      if (!best || n > best.n) best = { x, y, n };
    }
    return best;
  }
  const covered = E.SAMPLES.map(p => { let k = 0; for (const t of G.towers) if (need(t) && (t.x - p.x) ** 2 + (t.y - p.y) ** 2 <= t.s.range * t.s.range) k++; return k; });
  let best = null;
  for (let x = 20; x <= 1180; x += 20) for (let y = 20; y <= 580; y += 20) {
    if (E.canPlace(G, type, x, y)) continue;
    let n = 0;
    E.SAMPLES.forEach((p, i) => { if ((p.x - x) ** 2 + (p.y - y) ** 2 <= s.range * s.range) n += 1 / (1 + covered[i] * 1.5); });
    if (!best || n > best.n) best = { x, y, n };
  }
  return best;
}
function consejo() {
  if (!G || G.over) return;
  snd.init(); snd.resume();
  const r = Math.min(G.round, E.ROUNDS.length), types = expandTypes(r);
  const has = t => types.has(t);
  const any = f => G.towers.some(f);
  let type, msg, need = t => !t.s.aura;
  if ((has('blin') || has('col')) && !any(t => t.s.perfora)) { type = 'antitanque'; msg = 'Esta ronda trae blindados y nada los daña. Un antitanque acá cubre mucho camino.'; need = t => t.s.perfora; }
  else if (has('dronb') && !any(t => !t.s.aura && t.s.air)) { type = 'antiaerea'; msg = 'Vienen drones bajos y nada tira al aire. Primero una antiaérea; después, un radar cerca de ella.'; need = t => t.s.air; }
  else if (has('dronb') && !any(t => !t.s.aura && t.s.air && (t.s.detect || t.radar || G.globalDetect))) { type = 'radar'; msg = 'Vienen drones bajos y ninguna defensa los ve. Un radar acá deja verlos a las de alrededor.'; }
  else if ((has('dron') || has('nod')) && !any(t => !t.s.aura && t.s.air)) { type = 'antiaerea'; msg = 'Vienen drones y nada les tira. Una antiaérea acá los alcanza en dos tramos.'; need = t => t.s.air; }
  else {
    const armored = has('blin') || has('col');
    const perf = G.towers.filter(t => t.s.perfora).length;
    type = armored && perf < 2 ? 'antitanque' : 'torreta';
    need = armored && perf < 2 ? (t => t.s.perfora) : (t => !t.s.aura && t.s.ground);
    msg = armored && perf < 2 ? 'Los blindados de esta ronda necesitan más de un antitanque. Este tramo es el que menos fuego recibe.' : 'Este tramo del camino es el que menos fuego recibe. Una torreta acá suma donde más falta.';
  }
  const sp = spotFor(type, need);
  if (!sp) { toast('No encontré lugar libre. Probá vender o mejorar.'); return; }
  hint = { x: sp.x, y: sp.y, type, until: performance.now() + 9000 };
  const c = E.cost(G, E.TOWER[type].cost);
  toast(msg + (G.money < c ? ' Faltan <b>$' + fmt(c - G.money) + '</b>.' : ' Tocá <b>' + E.TOWER[type].name + '</b> abajo.'), 6500);
  if (G.log) G.log.consejos = (G.log.consejos || 0) + 1;
}

function goButton() {
  if (!G) return;
  snd.init(); snd.resume();

  else { speed = speed === 1 ? 2 : 1; }

$('go').addEventListener('click', goButton);
function handleEvents() {
  if (!G) return;
  const ev = G.events;
  for (let i = 0; i < ev.length; i++) {
    const e = ev[i];
    switch (e.k) {
      case 'shot': addFx({ k: 'shot', x0: e.x0, y0: e.y0, x1: e.x1, y1: e.y1, life: 3 }); snd.shot(); break;
      case 'launch': addFx({ k: 'proj', type: e.type, x0: e.x0, y0: e.y0, id: e.id, x1: e.x1, y1: e.y1, life: Math.max(2, e.n) }); snd.launch(e.type); break;
      case 'boom': addFx({ k: 'boom', x: e.x, y: e.y, r: Math.max(10, e.r), life: 9 }); if (e.type === 'antitanque' || e.r > 30) addFx({ k: 'smoke', x: e.x, y: e.y, r: Math.max(6, e.r * 0.4), life: 34 }); snd.boom(e.type); break;
      case 'stop': addFx({ k: 'spark', x: e.x, y: e.y, big: e.big, seed: (e.x * 7 + e.y * 13) | 0, life: e.big ? 16 : 8 }); addFx({ k: 'smoke', x: e.x, y: e.y, r: e.big ? 20 : 8, life: e.big ? 70 : 36 }); snd.spark(e.big); break;
      case 'retreat': addFx({ k: 'retreat', x: e.x, y: e.y, a: e.a, life: 42 }); break;
      case 'repair': addFx({ k: 'ring', x: e.x, y: e.y, r0: 6, r1: 80, col: 'rgba(238,107,47,', life: 14 }); break;
      case 'blackout': addFx({ k: 'ring', x: e.x, y: e.y, r0: 10, r1: e.r, col: 'rgba(163,193,114,', life: 12 }); snd.zap(); break;
      case 'leak': { const q = E.PATH[E.PATH.length - 1]; addFx({ k: 'ring', x: q[0] + 8, y: q[1], r0: 4, r1: 44, col: 'rgba(238,107,47,', life: 18 }); if (e.n > 0) snd.silence(); break; }
      case 'upgrade': { const tw = G.towers.find(t => t.id === e.id); if (tw) addFx({ k: 'ring', x: tw.x, y: tw.y, r0: 14, r1: 30, col: 'rgba(255,230,163,', life: 14 }); snd.upgrade(); break; }
      case 'place': snd.place(); break;
      case 'sell': addFx({ k: 'ring', x: e.x, y: e.y, r0: 16, r1: 4, col: 'rgba(236,230,210,', life: 10 }); break;
      case 'power': if (e.p === 'interferencia') addFx({ k: 'static', life: 12 }); snd.power(e.p); break;
      case 'roundStart': snd.roundStart(); snd.amb(0.22); radioT = 4 + Math.random() * 6; renderParte(); break;
      case 'roundEnd': onRoundEnd(e); break;
      case 'victory': onVictory(); break;
      case 'defeat': onDefeat(); break;
    }
  }
  ev.length = 0;
}
function onRoundEnd(e) {
  snd.roundEnd(); snd.amb(0.12);
  logRound();
  toast('Ronda ' + e.r + ' superada · sueldo <b>+$' + fmt(e.pay) + '</b>');
  if (G.checkpoint && !checkpointStr) { checkpointStr = G.checkpoint; setTimeout(() => toast('Punto de control: si perdés, volvés al comienzo de la ronda 11.'), 3300); }
  updateRecords(false);
  renderParte();
}
function onVictory() {
  logRound(); finishRec('ganada'); updateRecords(true);
  relight = { t0: performance.now(), from: lit, note: -1 };
  snd.amb(0.08);
  setTimeout(() => { relight = null; showEnd(); }, 3000);
  renderParte(); closePanel(); cancelMode();
}
function onDefeat() {
  logRound(); finishRec('perdida'); updateRecords(false);

}
function stars() { const f = G.lives / G.maxLives; return f >= 0.9 ? 3 : f >= 0.5 ? 2 : 1; }

/* ---------------- registro y récords ---------------- */
function saveRec() {
  if (!rec) return;
  const all = store.get('dpo-registro', []).filter(r => r.id !== rec.id);
  all.unshift(rec);
  store.set('dpo-registro', all.slice(0, 30));
}
function logRound() {
  if (!rec || !G) return;
  const R = G.log.rounds;
  rec.rondas = R.map(x => ({ r: x.r, perdidas: x.lost, filtrados: x.leaks, plata: x.money, seg: x.secs }));
  rec.ronda = Math.min(G.round, E.ROUNDS.length); rec.luces = Math.max(0, G.lives);
  rec.compras = G.log.buys.slice(); rec.mejoras = G.log.ups.slice(); rec.ventas = G.log.sells.slice(); rec.poderes = G.log.powers.slice();
  rec.consejos = G.log.consejos || 0;
  saveRec();
}
function finishRec(res) { if (!rec) return; rec.resultado = res; if (res === 'ganada') rec.estrellas = stars(); saveRec(); }
function updateRecords(won) {
  if (!G || G.free) return;
  const all = store.get('dpo-records', {});
  const cur = all[G.diff] || { ronda: 0, ganada: false, estrellas: 0 };
  cur.ronda = Math.max(cur.ronda, won ? E.ROUNDS.length : Math.min(G.round, E.ROUNDS.length));
  if (won) { cur.ganada = true; cur.estrellas = Math.max(cur.estrellas || 0, stars()); }
  all[G.diff] = cur; store.set('dpo-records', all);
}
const tname = t => E.TOWER[t].name.toLowerCase();
function registroTexto(list) {
  const out = ['DEFENSA POR OLEADAS v0 · registro de partidas', ''];
  list.forEach((r, i) => {
    const d = new Date(r.fecha);
    const when = d.toLocaleDateString('es-AR') + ' ' + d.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
    const res = r.resultado === 'ganada' ? 'ganada' + (r.estrellas ? ' ' + '★'.repeat(r.estrellas) : '') : r.resultado === 'perdida' ? 'perdida en la ronda ' + r.ronda : 'sin terminar, ronda ' + r.ronda;
    const m = Math.floor(r.seg / 60), s = Math.round(r.seg % 60);
    out.push(`#${list.length - i} · ${when} · ${E.DIFF[r.dif] ? E.DIFF[r.dif].name : r.dif} · ${res} · luces ${r.luces}/${r.max} · ${m} min ${s} s de juego` + (r.reintentos ? ` · volvió a la ronda 11 ${r.reintentos === 1 ? 'una vez' : r.reintentos + ' veces'}` + (r.caidas ? ` (había caído en la ronda ${r.caidas.join(', ')})` : '') : '') + (r.consejos ? ` · pidió ${r.consejos} consejo(s)` : ''));
    const malas = (r.rondas || []).filter(x => x.perdidas > 0).map(x => `R${x.r} −${x.perdidas} (${Object.entries(x.filtrados).map(([k, n]) => E.ENEMY[k].name.toLowerCase() + ' ×' + n).join(', ')})`);
    out.push('  Luces perdidas: ' + (malas.length ? malas.join(' · ') : 'ninguna'));
    if (r.compras && r.compras.length) out.push('  Compras: ' + r.compras.map(([rr, t]) => tname(t) + ' r' + rr).join(', '));
    if (r.mejoras && r.mejoras.length) out.push('  Mejoras: ' + r.mejoras.map(([rr, t, p, n]) => tname(t) + ' ' + (p ? 'B' : 'A') + n + ' r' + rr).join(', '));
    if (r.ventas && r.ventas.length) out.push('  Ventas: ' + r.ventas.map(([rr, t, v]) => tname(t) + ' r' + rr + ' $' + v).join(', '));
    if (r.poderes && r.poderes.length) out.push('  Poderes: ' + r.poderes.map(([rr, p]) => E.POWER[p].name.toLowerCase() + ' r' + rr).join(', '));
    const largas = (r.rondas || []).slice().sort((a, b) => b.seg - a.seg).slice(0, 3).map(x => `R${x.r} ${x.seg} s`);
    if (largas.length) out.push('  Rondas más largas (tiempo de juego): ' + largas.join(', '));
    out.push('');
  });
  return out.join('\n');
}

    const st = stars();
    h = '<p class="eyebrow">Parte final · Ronda 20</p><h1>La ciudad vuelve a encender las luces</h1>'
      + `<div class="stars">${'★'.repeat(st)}<span>${'★'.repeat(3 - st)}</span></div>`
      + `<div class="tx"><p>${FINAL_OK}</p></div>`
      + `<p>Quedaron ${G.lives} de ${G.maxLives} luces. ${m} minutos de juego, ${G.towers.length} defensas en pie.</p>`
      + `<div class="links"><button class="btn pri" type="button" data-a="new" data-d="${G.diff}">Jugar otra vez</button><button class="btn" type="button" data-a="registro">Registro</button><button class="btn" type="button" data-a="home">Inicio</button></div>`;
  } else {
    h = `<p class="eyebrow">Parte · Ronda ${Math.min(G.round, E.ROUNDS.length)}</p><h1>Se apagaron las luces</h1>`
      + `<div class="tx"><p>${FINAL_NO}</p></div>`
      + `<p>Llegaste a la ronda ${Math.min(G.round, E.ROUNDS.length)} de ${E.ROUNDS.length}, en ${m} minutos de juego.${lastLeakText()}</p>`
      + '<div class="links">' + (checkpointStr ? '<button class="btn pri" type="button" data-a="volver">Volver a la ronda 11</button>' : '')
      + `<button class="btn ${checkpointStr ? '' : 'pri'}" type="button" data-a="new" data-d="${G.diff}">Empezar de nuevo</button><button class="btn" type="button" data-a="registro">Registro</button><button class="btn" type="button" data-a="home">Inicio</button></div>`;
  }
  openSheet(h, 'end');
}
function lastLeakText() {
  const R = G.log.rounds[G.log.rounds.length - 1];
  if (!R) return '';
  const top = Object.entries(R.leaks).sort((a, b) => E.ENEMY[b[0]].carga * b[1] - E.ENEMY[a[0]].carga * a[1])[0];
  if (!top) return '';
  return ` Lo que más luces apagó en la última ronda: ${PLURAL[top[0]]} (${top[1]}). Mirá su ficha para ver quién los frena.`;
}
function volverACheckpoint() {
  if (!checkpointStr) return;
  const keep = checkpointStr;
  G = E.restore(keep); G.checkpoint = keep;
  paused = false; speed = 1; sel = null; mode = null; fx = []; relight = null; endShown = false;
  lit = Math.round(CITY.lights.length * G.lives / G.maxLives); uiCache = {}; staticKey = '';
  if (rec) { rec.caidas = (rec.caidas || []).concat([rec.ronda]); rec.reintentos = (rec.reintentos || 0) + 1; rec.resultado = 'sin terminar'; saveRec(); }
  closeSheet(); closePanel(); cancelMode(); renderParte();
  toast('Volviste al comienzo de la ronda 11, con lo que tenías entonces.');
}
$('sheet').addEventListener('click', async ev => {
  const b = ev.target.closest('button[data-a]'); if (!b) return;
  const a = b.dataset.a;
  if (a === 'new') newGame(b.dataset.d);
  else if (a === 'close') closeSheet();
  else if (a === 'home') { G = null; closePanel(); cancelMode(); renderParte(); renderSpawn(); snd.amb(0); startScreen(); }
  else if (a === 'ayuda') openHelp(0, false);
  else if (a === 'help') openHelp(+b.dataset.i, b.dataset.f === '1');
  else if (a === 'helpdone') { prefs.ayuda = true; savePrefs(); closeSheet(); toast('Leé el parte y tocá <b>▶ Ronda 1</b> cuando estés listo.'); }
  else if (a === 'fichas') openFichas(b.dataset.t || 'defensas');
  else if (a === 'registro') openRegistro();
  else if (a === 'creditos') openCreditos();
  else if (a === 'volver') volverACheckpoint();
  else if (a === 'copiar') {
    const t = $('regTxt'); let ok = false;
    try { await navigator.clipboard.writeText(t.value); ok = true; } catch (e) { t.focus(); t.select(); try { ok = document.execCommand('copy'); } catch (e2) { ok = false; } }
    $('regMsg').textContent = ok ? 'Copiado. Pegalo en el chat.' : 'Seleccioné el texto: copialo a mano.';
  } else if (a === 'borrarReg') {
    if (b.dataset.ok) { store.set('dpo-registro', []); openRegistro(); }
    else { b.dataset.ok = '1'; b.textContent = 'Tocá otra vez para borrar'; }
  }
});
$('sheet').addEventListener('click', ev => { if (ev.target === $('sheet') && sheetMode !== 'start' && sheetMode !== 'end' && G) closeSheet(); });

/* ---------------- botones de arriba y teclado ---------------- */
$('bConsejo').addEventListener('click', consejo);
function togglePause() { if (!G || G.over) return; paused = !paused; $('bPausa').setAttribute('aria-pressed', String(paused)); snd.amb(paused ? 0.04 : (G.inRound ? 0.22 : 0.12)); }
$('bPausa').addEventListener('click', togglePause);
function paintSound() { $('bSonido').setAttribute('aria-pressed', String(prefs.sonido)); $('sOn').style.display = prefs.sonido ? '' : 'none'; }
$('bSonido').addEventListener('click', () => { prefs.sonido = !prefs.sonido; savePrefs(); snd.init(); snd.resume(); snd.setOn(); paintSound(); });
$('bMenu').addEventListener('click', openMenu);
$('rotOk').addEventListener('click', () => { rotateDismissed = true; $('rotate').hidden = true; });
window.addEventListener('keydown', ev => {
  if (!$('sheet').hidden) { if (ev.key === 'Escape' && G && sheetMode !== 'end' && sheetMode !== 'start') closeSheet(); return; }
  if (!G) return;
  if (ev.key >= '1' && ev.key <= '4') pickTower(E.TOWER_KEYS[+ev.key - 1]);
  else if (ev.key === ' ') { ev.preventDefault(); goButton(); }
  else if (ev.key === 'Escape') { cancelMode(); closePanel(); }
  else if (ev.key === 'p' || ev.key === 'P') togglePause();
  else if (ev.key === 'q' || ev.key === 'Q') pickPower('bengala');
  else if (ev.key === 'w' || ev.key === 'W') pickPower('interferencia');
  else if (ev.key === 'e' || ev.key === 'E') pickPower('humo');
});
document.addEventListener('visibilitychange', () => { if (document.hidden && G && !G.over && !paused) togglePause(); });
window.addEventListener('resize', layout);

/* ---------------- bucle ---------------- */
let last = performance.now(), acc = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  const running = G && !G.over && !paused && $('sheet').hidden;
  if (running) {
    acc += dt * speed;
    let n = 0;
    while (acc >= E.TICK && n < 10) { E.step(G); fxStep(); handleEvents(); acc -= E.TICK; n++; if (!G || G.over) break; }
    if (n >= 10) acc = 0;
    if (rec) rec.seg += dt;
    if (G && G.inRound) { radioT -= dt; if (radioT < 0) { snd.radio(); radioT = 9 + Math.random() * 12; } }
  } else if (G && G.over) { fxStep(); }
  draw(now / 1000);
  updateUI();
  requestAnimationFrame(frame);
}

/* ---------------- arranque ---------------- */
layout(); buildBar(); paintSound(); startScreen();
requestAnimationFrame(t => { last = t; frame(t); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { staticKey = ''; paintIcons(document); });
window.__dpo = { get G() { return G; }, E, newGame, consejo, goButton, CITY, setSpeed(v) { speed = v; } };
})();

</script>
